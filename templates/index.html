
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Student Result Management System</h1>
        <p>Enter student details to calculate the result.</p>

        <form action="/result" method="POST">
            <label for="name">Student Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter student name" required>

            <label for="mark1">Subject 1 Marks</label>
            <input type="number" id="mark1" name="mark1"
                   min="0" max="100" step="any" required>

            <label for="mark2">Subject 2 Marks</label>
            <input type="number" id="mark2" name="mark2"
                   min="0" max="100" step="any" required>

            <label for="mark3">Subject 3 Marks</label>
            <input type="number" id="mark3" name="mark3"
                   min="0" max="100" step="any" required>

            <button type="submit">Calculate Result</button>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            <a href="/students">View All Student Records</a>
        </p>
    </div>
</body>
</html>
